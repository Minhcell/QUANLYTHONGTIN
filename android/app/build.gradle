plugins { id "com.android.application" }

android {
    namespace "vn.sothuebao"
    compileSdk 34
    defaultConfig {
        applicationId "vn.sothuebao"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }
    sourceSets {
        // dùng chung giao diện web với bản PC
        main { assets.srcDirs = ["../../web"] }
    }
    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "androidx.documentfile:documentfile:1.0.1"
}
