name: Build SoThueBao (exe + apk)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Kiểm tra đủ file
        shell: bash
        run: |
          ls -la pc web
          for f in pc/package.json pc/main.js pc/preload.js web/index.html web/xlsx.full.min.js; do
            if [ ! -f "$f" ]; then echo "::error::Thiếu file $f trên GitHub. Hãy upload lại file này."; missing=1; fi
          done
          [ -z "$missing" ]
      - name: Copy giao diện web vào bản PC
        shell: bash
        run: rm -rf pc/web && cp -r web pc/web
      - name: Cài thư viện
        working-directory: pc
        run: npm install --no-audit --no-fund
      - name: Đóng gói SoThueBao.exe
        working-directory: pc
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: SoThueBao-exe
          path: pc/dist/SoThueBao.exe

  android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build APK
        working-directory: android
        run: gradle assembleDebug --no-daemon
      - name: Đổi tên APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk SoThueBao.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SoThueBao-apk
          path: SoThueBao.apk
